name: Build and test
description: Build the site and run its tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install site dependencies
      shell: bash
      run: npm ci
    - name: Build site
      shell: bash
      run: npm run build
    - name: Run tests
      shell: bash
      run: npm test
